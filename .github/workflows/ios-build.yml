name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Compile KMP framework
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinIosArm64 --info --no-daemon 2>&1 | tee kmp-compile.log

      - name: Upload KMP compile log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmp-compile-log
          path: kmp-compile.log

      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/AnyTViOS.xcodeproj \
            -scheme AnyTViOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R iosApp/build/derived/Build/Products/Release-iphoneos/AnyTViOS.app Payload/
          zip -r AnyTViOS.ipa Payload

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyTViOS-App
          path: iosApp/build/derived/Build/Products/Release-iphoneos/AnyTViOS.app

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnyTViOS-IPA
          path: AnyTViOS.ipa

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            iosApp/build/derived/Build/Logs
